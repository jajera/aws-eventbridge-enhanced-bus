[project]
site_name = "Enhanced EventBridge custom event bus"
site_description = "Cross account ordered alerts on an enhanced EventBridge custom event bus"
site_url = "https://aws-eventbridge-enhanced-bus.johna.kiwi/"
nav = [
  { "Overview" = "index.md" },
  { "Patterns" = "patterns.md" },
  { "Design" = "design.md" },
  { "Cost" = "cost.md" },
  { "Demo" = [
    { "Overview" = "demo/index.md" },
    { "Prerequisites" = "demo/prerequisites.md" },
    { "Check profiles" = "demo/profiles.md" },
    { "Deploy lab" = "demo/lab.md" },
    { "Deploy dev" = "demo/dev.md" },
    { "Verify" = "demo/verify.md" },
    { "Tear down" = "demo/teardown.md" },
    { "Troubleshooting" = "demo/troubleshooting.md" },
  ]},
  { "References" = "references.md" },
]
# site.css is linked in overrides/main.html AFTER patina.css so local .run
# overrides win the cascade (equal-specificity !important resolves by order).

[project.theme]
name = "patina"
custom_dir = "overrides"
language = "en"
favicon = "assets/favicon.png"
logo = "assets/favicon.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed" = { alternate_style = true }
toc.permalink = true
zensical.extensions.glightbox = { width = "95vw", height = "auto", zoomable = true }
