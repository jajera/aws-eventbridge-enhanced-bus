  <title id="title">Lab: IoT to eb-bridge to enhanced bus to RAM; dev: FIFO Subscriber to health-eval</title>
  <desc id="desc">Official AWS icons. Lab: IoT Core rule invokes Lambda eb-bridge, PutEvents to EventBridge lab-events, RAM share to dev. Dev: FIFO Subscriber with filter, IAM delivery role, Lambda health-eval, DynamoDB health-alerts, SQS DLQ.</desc>
